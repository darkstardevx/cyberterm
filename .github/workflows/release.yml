name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # x86_64-apple-darwin (Intel Mac) dropped: macos-13 runner queue
          # capacity has been badly degraded on GitHub's side (a job sat
          # queued for over an hour, twice, while every other target in
          # the same matrix finished in under a minute) and Apple hasn't
          # sold an Intel Mac since 2023 -- aarch64-apple-darwin covers
          # every Mac actually shipping today.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev

      # aarch64/x86_64-linux-gnu and both macOS targets each build natively
      # on a matching runner -- no cross/QEMU needed, and no cross Docker
      # image to keep in sync with the X11/Wayland/GL dev headers above.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin cyberterm

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="cyberterm-${{ matrix.target }}.tar.gz"
          tar -czf "dist/$archive" -C "target/${{ matrix.target }}/release" cyberterm
          cd dist && shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberterm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
